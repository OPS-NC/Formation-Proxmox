# /etc/pve/sdn/zones.cfg — TP 16
#
# ⭐ Les 5 réglages qui font que ça marche :
#   1. frr + frr-pythontools installés sur TOUS les nœuds
#   2. exitnodes-primary        → OBLIGATOIRE dès que snat est actif (conntrack local)
#   3. mtu 1450                 → 1500 − 50 octets d'entête VXLAN
#   4. advertise-subnets 1      → annonce les /24 (routes type-5), pas seulement les /32
#   5. pvesh set /cluster/sdn   → l'apply, après chaque modification

evpn: zevpn
	controller evpnctl
	vrf-vxlan 10000
	mtu 1450
	nodes pve1,pve2,pve3,pve4,pve5,pve6
	exitnodes pve1,pve2
	exitnodes-primary pve1
	exitnodes-local-routing 1
	advertise-subnets 1
	ipam pve
	dhcp dnsmasq
