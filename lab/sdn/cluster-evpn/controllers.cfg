# /etc/pve/sdn/controllers.cfg — TP 16
#
# Un ASN unique pour tous les nœuds  ⇒  iBGP en full-mesh.
# Avec 6 nœuds : 15 sessions, parfaitement raisonnable.
# Au-delà d'une dizaine de nœuds : fabric BGP + route-reflectors.

evpn: evpnctl
	asn 65000
	peers 192.168.50.11,192.168.50.12,192.168.50.13,192.168.50.14,192.168.50.15,192.168.50.16
