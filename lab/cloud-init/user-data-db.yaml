#cloud-config
# Serveur de base de données — TP 11
# Volontairement minimaliste : la configuration fine est le travail d'Ansible (TP 13).

hostname: db01
manage_etc_hosts: true

users:
  - name: eleve
    groups: [sudo, adm]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAA_REMPLACEZ_PAR_VOTRE_CLE eleve@formation

package_update: true
packages:
  - postgresql
  - qemu-guest-agent
  - python3-psycopg2
  - prometheus-node-exporter

write_files:
  - path: /etc/sysctl.d/90-postgres.conf
    content: |
      vm.swappiness = 10
      vm.overcommit_memory = 2

runcmd:
  - [ systemctl, enable, --now, qemu-guest-agent ]
  - [ systemctl, enable, --now, postgresql ]
  - [ sysctl, --system ]

final_message: "☑ base prête — $(hostname)"
