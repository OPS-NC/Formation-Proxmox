---
# Playbook principal — les machines du parc Proxmox.
#
#   ansible-playbook site.yml --syntax-check
#   ansible-playbook site.yml --check --diff     # répétition générale
#   ansible-playbook site.yml
#   ansible-playbook site.yml --limit proxmox_web
#
# ⭐ Le critère de qualité : un SECOND passage doit afficher « changed=0 ».
#
# 🧠 Le serveur NFS n'est pas ici : il tourne sur votre poste de travail.
#    Voir nfs-local.yml et inventory/local.yml (TP 14).

- name: Socle commun — toutes les machines Linux
  hosts: linux:conteneurs
  become: true
  gather_facts: true
  roles:
    - common

- name: Serveurs web
  hosts: proxmox_web
  become: true
  roles:
    - web

- name: Serveurs de bases de données
  hosts: proxmox_db
  become: true
  roles:
    - db
