---
# Test de connectivité et affichage de l'inventaire résolu.
#
#   ansible-playbook ping.yml

- name: Vérifier la joignabilité
  hosts: all
  gather_facts: false
  tasks:
    - name: Ping Ansible
      ansible.builtin.ping:

- name: Résumé de l'inventaire
  hosts: all
  gather_facts: true
  tasks:
    - name: Fiche de la machine
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} |
          {{ ansible_host }} |
          {{ ansible_distribution }} {{ ansible_distribution_version }} |
          groupes : {{ group_names | reject('match', '^(all|ungrouped)$') | join(', ') }}
