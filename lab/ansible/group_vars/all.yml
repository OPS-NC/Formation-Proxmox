---
# ── Connexion SSH ────────────────────────────────────────────────────────────
# Les VM vivent dans les VNets 10.10.x.0/24. Le PC les joint DIRECTEMENT, grâce
# à une route statique qui passe par le nœud (posée au TP 07) :
#   sudo ip route add 10.10.0.0/16 via $PVE
# Pas de bastion, pas de ProxyCommand. Les clés d'hôte des VM changent à chaque
# recréation par Terraform : on ne les épingle pas.
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null

# ── Rôle common ──────────────────────────────────────────────────────────────
common_timezone: "Pacific/Noumea"
common_admin_user: "eleve"
common_packages:
  - curl
  - vim
  - htop
  - git
  - rsync
  - ca-certificates
