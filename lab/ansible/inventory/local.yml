---
# Inventaire statique pour configurer VOTRE POSTE UBUNTU (TP 14).
# ⚠ Adaptez l'IP de votre nœud sur la ligne marquée.
all:
  hosts:
    poste-ubuntu:
      ansible_host: localhost
      ansible_connection: local
  vars:
    nfs_manage_disk: false
    nfs_root: "/srv/nfs"
    nfs_allowed_network: "172.30.30.151"     # ⚠ l'IP de VOTRE nœud ($PVE)
    # Laisser la valeur par défaut du rôle (layout Proxmox) sauf besoin précis :
    # nfs_subdirs: [images, dump, template/iso, template/cache, snippets]
