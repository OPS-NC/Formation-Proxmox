---
# Inventaire dynamique construit depuis l'API Proxmox.
# ⭐ Les groupes sont dérivés des TAGS posés par Terraform (TP 11).
#
#   ansible-inventory --graph
#   ansible-inventory --host web01 | jq
#
# Prérequis : sudo apt install -y python3-proxmoxer
#             ansible-galaxy collection install community.proxmox
#
# ⚠ « community.general.proxmox » est DÉPRÉCIÉ : il n'est plus qu'une redirection
#   vers community.proxmox.proxmox, et sera supprimé en community.general 15.0.0.
#   La redirection exige de toute façon que community.proxmox soit installée —
#   autant nommer la collection directement. Les variables (proxmox_tags_parsed,
#   proxmox_vmtype, proxmox_node…) et les options sont identiques.

plugin: community.proxmox.proxmox

# ⚠ adapter à l'IP de VOTRE nœud ($PVE), et exporter le secret :
#   source ~/.config/pve/token.env
url: "https://172.30.30.151:8006"
user: ansible@pve
token_id: inv
token_secret: "{{ lookup('env', 'PVE_ANSIBLE_TOKEN_SECRET') }}"
validate_certs: false

want_facts: true
qemu_extended_statuses: true

keyed_groups:
  # ⭐ un groupe par tag Proxmox : proxmox_web, proxmox_db, proxmox_nfs…
  - key: proxmox_tags_parsed
    separator: "_"
    prefix: proxmox
  # un groupe par nœud : node_pve (jours 1-3), node_pve3… en cluster
  - key: proxmox_node
    prefix: node
  # un groupe par pool : pool_lab
  - key: proxmox_pool
    prefix: pool

groups:
  # ⭐ « linux » = les VM déployées par Terraform (tag « terraform »), celles que
  #   cloud-init a préparées pour Ansible (compte eleve + clé). Les machines faites à
  #   la main (srv01, cloud01, win01, pbs) n'y sont pas — elles restent dans leurs
  #   groupes par tag (proxmox_web…) si on leur en pose un.
  linux: >-
    proxmox_vmtype == 'qemu' and
    'terraform' in (proxmox_tags | default(''))
  conteneurs: "proxmox_vmtype == 'lxc'"
  windows: "'windows' in (proxmox_tags | default(''))"

# ── L'adresse de connexion ────────────────────────────────────────────────
# ⚠ Deux sources DIFFÉRENTES selon le type de guest :
#   · VM QEMU → proxmox_agent_interfaces, via l'agent invité
#               (/nodes/<n>/qemu/<id>/agent/network-get-interfaces)
#   · LXC     → proxmox_lxc_interfaces, via l'API du conteneur
#               (/nodes/<n>/lxc/<id>/interfaces) — un LXC n'a PAS d'agent QEMU
#
# Les deux exigent « want_facts: true » et un guest DÉMARRÉ. On concatène les
# deux listes : la première adresse IPv4 non-loopback gagne.
#
# 🪤 Sans la branche LXC, ansible_host retombe sur proxmox_name — le nom du
#    conteneur, que rien ne résout dans le lab → UNREACHABLE.
compose:
  ansible_host: >-
    (
      (proxmox_agent_interfaces | default([])
        | rejectattr('name', 'eq', 'lo')
        | map(attribute='ip-addresses') | flatten
        | selectattr('ip-address-type', 'eq', 'ipv4')
        | map(attribute='ip-address') | list)
      +
      (proxmox_lxc_interfaces | default([])
        | rejectattr('name', 'eq', 'lo')
        | selectattr('inet', 'defined')
        | map(attribute='inet')
        | map('regex_replace', '/.*$', '') | list)
    ) | first | default(proxmox_name)

cache: true
cache_plugin: jsonfile
cache_timeout: 120
cache_connection: /tmp/ansible-pve-cache
